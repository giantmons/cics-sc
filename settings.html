<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CICS-SC</title>

    <!--External CSS Link-->
    <link rel="stylesheet" href="setting.css">
    <link rel="stylesheet" href="framework.css">
    <link rel="stylesheet" href="master.css">
    


    <!--External JS Link-->
    <script src="main.js" defer></script>

    <!--IONICONS Link-->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <!----------------NAVIGATION STARTS------------------> 
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="dashboard.html">
                        <span class="icon">
                            <img src="nav_img/CICS.png" alt="">
                        </span>
                        <span class="title">CICS-SC ONLINE</span>
                    </a>
                </li>
                <!--DASHBOARD HOME-->
                <li>
                    <a href="dashboard.html">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>

                <!--STUDENTS-->
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="people-outline"></ion-icon><!--PAGE NG LIST NG STUDENTS-->
                        </span>
                        <span class="title">Students</span>
                    </a>
                </li>

                <!--EMAILS-->
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="mail-outline"></ion-icon><!--PAGE NG LIST EMAILS-->
                        </span>
                        <span class="title">Emails</span>
                    </a>
                </li>

                <!--SETTINGS-->
                <li>
                    <a href="settings.html">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon> <!--PAGE NG SETTINGS-->
                        </span>
                        <span class="title">Settings</span>
                    </a>
                </li>

                <!--LOG OUT-->
                <li>
                    <a href="index.html">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Sign Out</span>
                    </a>
                </li>

            </ul>
        </div>
        <!----------------NAVIGATION ENDS------------------>

        <!----------------MAINBOARD STARTS------------------>
        <div class="main">

            <!--TOP BAR-->
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>

                <div class="search"> <!--BASED ON DataBased-->
                    <label>
                        <input type="text" placeholder="Search here">
                        <ion-icon name="search-outline"></ion-icon>
                    </label>
                </div>
            </div>

            <h1 class="p-relative">Settings</h1>
            <div class="settings-page m-20 d-grid gap-20">

            <!-- Start Settings Box -->
            <div class="p-20 bg-white rad-10">
                <h2 class="mt-0 mb-10">General Info</h2>
                <p class="mt-0 mb-20 c-grey fs-15">General Information About Your Account</p>
                
                <div class="mb-15">
                    <label class="fs-14 c-grey d-block mb-10" for="first">First Name</label>
                        <input
                            class="b-none border-ccc p-10 rad-6 d-block w-full"
                            type="text"
                            id="first"
                            placeholder="First Name"
                        />
                </div>

                <div class="mb-15">
                    <label class="fs-14 c-grey d-block mb-5" for="last">Last Name</label>
                        <input
                            class="b-none border-ccc p-10 rad-6 d-block w-full"
                            id="last"
                            type="text"
                            placeholder="Last Name"
                        />
                </div>

                <div>
                    <label class="fs-14 c-grey d-block mb-5" for="email">Email</label>
                        <input
                            class="email b-none border-ccc p-10 rad-6 w-full mr-10"
                            id="email"
                            type="email"
                            value="your@gmail.com"
                            disabled
                        />
                    <a class="c-blue" href="#">Change</a>
                </div>
            </div>
            <!-- End Settings Box -->

            <!-- Start Settings Box -->
            <div class="p-20 bg-white rad-10">
                <h2 class="mt-0 mb-10">Security Info</h2>
                <p class="mt-0 mb-20 c-grey fs-15">Security Information About Your Account</p>
                
                <div class="sec-box mb-15 between-flex">
                    <div>
                        <span>Password</span>
                        <p class="c-grey mt-5 mb-0 fs-13">Last Change On 25/10/2021</p>
                    </div>
                    <a class="button bg-blue c-white btn-shape" href="#">Change</a>
                </div>
            
            </div>
            <!-- End Settings Box -->
      </div>
    </div>
  </body>
</html>
